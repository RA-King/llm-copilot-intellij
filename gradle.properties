# Gradle JVM arguments
org.gradle.jvmargs=--enable-native-access=ALL-UNNAMED -Xmx2g -Xms512m

# Java 25 users: gradlew auto-detects IntelliJ's bundled JDK 21.
# Override manually if needed:
#org.gradle.java.home=/Applications/IntelliJ IDEA 2026.1.app/Contents/jbr/Contents/Home
#org.gradle.java.home=/Applications/IntelliJ IDEA.app/Contents/jbr/Contents/Home
#org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home

# IntelliJ IDEA installation path (override if auto-detection fails)
#intellijIdeaPath=/Applications/IntelliJ IDEA 2026.1.app
#intellijIdeaPath=/Applications/IntelliJ IDEA.app

# IntelliJ Platform version used ONLY when no local IDE is installed (e.g. CI).
# Ignored whenever a local installation is found.
#platformVersion=2026.1

# Kotlin DSL
kotlin.stdlib.default.dependency=false
